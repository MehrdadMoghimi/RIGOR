name: RIGOR
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  # Python
  - python=3.11
  
  # Core ML/RL libraries
  - pytorch>=2.2.0
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio
  - numpy>=1.24.0
  - gymnasium>=0.29.1
  
  # Additional RL/ML libraries
  - tensorboard>=2.14.0
  - tqdm>=4.66.0
  - wandb>=0.16.0
  
  # CleanRL utilities (via pip)
  - pip
  - pip:
    - tyro>=0.8.0
    - ale-py>=0.8.0
    - shimmy>=1.3.0
    - tensordict>=0.5.0
    - torchrl>=0.5.0
    - opencv-python>=4.8.0
    - huggingface-hub>=0.19.0
    - imageio>=2.31.0
    - moviepy>=1.0.3
    - shapely>=2.0.0
    - matplotlib>=3.7.0
    - seaborn>=0.12.0
    
  # Development tools (optional)
  - jupyter
  - ipython
  - black
  - isort
  - flake8
  - pytest
  - pre-commit